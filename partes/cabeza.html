<!-- script bloqueante: clases antes del primer pintado y el puente común window.BOX (lo usan main.js, espejo.js y caja.js) -->
<script>
(function (d, w) {
  var h = d.documentElement;
  h.classList.add('js');
  // recargar a media página con cortina: siempre arriba salvo que haya #ancla
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; if (!location.hash) w.scrollTo(0, 0); } catch (e) {}
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
  var mov = !(w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (mov) h.classList.add('con-movimiento'); else h.classList.add('sin-movimiento');
  h.classList.add('cortina-activa');

  /* ---------- window.BOX: API común (estable) ----------
     BOX.movimiento            false con prefers-reduced-motion: saltar al estado final, sin bucles
     BOX.sobria()              true con la densidad sobria del mando (?revision&densidad=sobria)
     BOX.alAbrirse(fn)         fn al EMPEZAR a abrirse la cortina (o ya, si se abrió)
     BOX.fotos                 { clave: { anchos:[…], ancho, alto } } (lo rellena construir.mjs)
     BOX.foto(clave, w, ext)   ruta de la foto con el ancho más pequeño ≥ w (ext: 'jpg' | 'webp' | 'avif')
     BOX.srcset(clave, ext)    srcset completo de esa foto
     BOX.prendas()             Promise<Array> con datos/prendas.json (respaldo dentro de la página si falla la red)
     BOX.prenda(id)            Promise<Objeto|undefined>
     BOX.whatsapp(texto)       abre WhatsApp con el texto; mientras falte el número, avisa de que falta
     BOX.tel                   número en formato +34…, o '' mientras no se sepa
     Eventos en document: 'box:abierta' (empieza a abrirse la cortina) y 'box:fuera' (ya no está). */
  var B = w.BOX = w.BOX || {};
  B.movimiento = mov;
  B.sobria = function () { return h.classList.contains('densidad-sobria'); };
  B.fotos = B.fotos || {};
  B.foto = function (clave, ancho, ext) {
    var f = B.fotos[clave]; if (!f) return '';
    var a = f.anchos.filter(function (x) { return x >= (ancho || 800); })[0] || f.anchos[f.anchos.length - 1];
    return 'img/fotos/' + clave + '-' + a + '.' + (ext || 'jpg');
  };
  B.srcset = function (clave, ext) {
    var f = B.fotos[clave]; if (!f) return '';
    return f.anchos.map(function (a) { return 'img/fotos/' + clave + '-' + a + '.' + (ext || 'jpg') + ' ' + a + 'w'; }).join(', ');
  };
  var prom = null;
  B.prendas = function () {
    if (prom) return prom;
    var respaldo = function () {
      try { return JSON.parse(d.getElementById('prendas-respaldo').textContent).prendas; } catch (e) { return []; }
    };
    prom = (w.fetch ? fetch('datos/prendas.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) { return j.prendas; }) : Promise.reject())
      .catch(respaldo);
    return prom;
  };
  B.prenda = function (id) { return B.prendas().then(function (l) { return l.filter(function (p) { return p.id === id; })[0]; }); };
  B.tel = B.tel || '';
  B.whatsapp = function (texto) {
    if (B.tel) { w.open('https://wa.me/' + B.tel.replace(/\D/g, '') + '?text=' + encodeURIComponent(texto || ''), '_blank', 'noopener'); return true; }
    var av = d.getElementById('aviso-tel');
    if (av) { av.hidden = false; av.classList.add('ve'); clearTimeout(B._avT); B._avT = setTimeout(function () { av.classList.remove('ve'); av.hidden = true; }, 5200); }
    return false;
  };

  // el puente con la cortina
  var cola = [];
  var avisar = function (n) { try { d.dispatchEvent(new CustomEvent(n)); } catch (e) {} };
  B.alAbrirse = function (fn) { if (B.abierta) { try { fn(); } catch (e) { console.warn(e); } } else cola.push(fn); };
  B.abrir = function () {
    if (B.abierta) return;
    B.abierta = true;
    cola.splice(0).forEach(function (fn) { try { fn(); } catch (e) { console.warn(e); } });
    avisar('box:abierta');
  };
  B.retirarCortina = function () {
    if (B.cortinaFuera) return;
    B.cortinaFuera = true;
    clearTimeout(w.__redCortina);
    h.classList.remove('cortina-activa');
    h.classList.add('cortina-fuera');
    B.abrir();
    if (!location.hash && w.scrollY > 0) w.scrollTo(0, 0);
    avisar('box:fuera');
  };
  // red de seguridad por si main.js no llega: la cortina se va sola
  w.__redCortina = setTimeout(function () { B.retirarCortina(); }, 6500);
})(document, window);
</script>
