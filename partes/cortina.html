<!-- cortina de entrada: el rótulo se monta pieza a pieza con luz rasante, la caja de la O abre sus solapas y enseña la prenda,
     se vuelve a cerrar hasta dejar la ranura y el rótulo entero vuela a su sitio en la portada (js/main.js).
     Cada pieza es una capa propia con el relieve pintado una vez: todo el movimiento es transform/opacity (tarjeta gráfica). -->
<div class="cortina" id="cortina" aria-hidden="true">
  <div class="cortina__pared" id="cort-pared"></div>
  <div class="cortina__centro">
    <div class="cortina__rot" id="cort-rot">
      <div class="cortina__foto" id="cort-foto"><img id="cort-img" alt=""></div>
    </div>
  </div>
  <div class="cortina__haz" id="cort-haz"></div>
  <p class="cortina__pie" id="cort-pie">Rúa do Hórreo · Carballo</p>
</div>
<script>/* red de seguridad inline por si main.js no llega */ setTimeout(function(){ if (window.BOX && !BOX.cortinaFuera && !BOX.cortinaEnMarcha) BOX.retirarCortina(); }, 2500);</script>
